name: Release scheduled pins
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    paths: ["pins.json", "build.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          PIN_VERIFY: ${{ vars.PIN_VERIFY }}
      - run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Release scheduled pins" && git push)
